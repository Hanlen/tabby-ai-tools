  <radialGradient id="glow"><stop stop-color="#39796f" stop-opacity=".2"/><stop offset="1" stop-color="#39796f" stop-opacity="0"/></radialGradient>
  <linearGradient id="edge"><stop stop-color="#4f827e"/><stop offset=".5" stop-color="#35455c"/><stop offset="1" stop-color="#363950"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="150%"><feDropShadow dy="15" stdDeviation="20" flood-color="#030712" flood-opacity=".5"/></filter>
</defs>
<style>
