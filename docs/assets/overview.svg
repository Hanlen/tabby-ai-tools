<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
<title id="title">Tabby AI Tools — AI beside your terminal</title>
<desc id="desc">界面示意图，非运行截图。左侧展示 Codex 对话、任务状态和权限，右侧展示 Tabby 标签与示例终端。下方介绍按目录恢复会话、终端协作与持久目标。</desc>
<defs>
