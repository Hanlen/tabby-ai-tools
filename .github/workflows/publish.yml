name: Publish verified release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag
        required: true
        type: string
      dry_run:
        description: Verify the release without publishing
        default: true
        type: boolean

concurrency:
  group: npm-production-publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: github.repository == 'Hanlen/tabby-ai-tools' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.15.0 --registry=https://registry.npmjs.org/
      - name: Verify and publish the existing release attachment
        run: node .github/scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
